<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X-ATHENA - Login</title>

  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Nosifer&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: black url('/assets/bg.jpg') center/cover no-repeat;
      min-height: 100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:'UnifrakturCook', cursive;
      color:#B22222;
    }
    .card {
      background:rgba(0,0,0,0.7);
      border-radius:20px;
      padding:30px;
      max-width:380px;
      width:100%;
      box-shadow:0 0 30px rgba(138,3,3,0.7);
      text-align:center;
    }
    .title {
      font-size:32px;
      font-family:'Nosifer', cursive;
      color:white;
      margin-bottom:10px;
      text-shadow:0 0 10px #8A0303;
    }
    input {
      width:100%;
      padding:14px 16px;
      background:black;
      border:none;
      border-radius:10px;
      color:white;
      margin-bottom:15px;
      font-size:14px;
      box-shadow: inset 0 0 10px rgba(138,3,3,0.5);
    }
    button {
      width:100%;
      padding:13px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-size:15px;
      background:linear-gradient(135deg,#8A0303,#000);
      color:white;
      font-weight:bold;
      text-shadow: 0 0 6px #8A0303;
    }
    .toast {
      position:fixed;
      bottom:40px;
      left:50%;
      transform:translateX(-50%);
      background:#8A0303;
      color:white;
      padding:12px 18px;
      border-radius:8px;
      font-size:13px;
      display:none;
      z-index:999;
    }
  </style>
</head>

<body>

  <div class="card">
    <img src="https://res.cloudinary.com/shaa/image/upload/v1757339222/shaastore/o35g1v4so0tnczirobmz.jpg" width="110" style="border-radius:50%;border:2px solid #8A0303;margin-bottom:15px;">

    <div class="title">X-ATHENA</div>
    <div style="font-size:12px;margin-bottom:20px;font-family:Arial;">© 2025 X4thena</div>

    <form id="loginForm">
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit"><i class="fas fa-biohazard"></i> LOGIN <i class="fas fa-biohazard"></i></button>
    </form>

    <a href="https://t.me/AmmNotDev2" target="_blank" style="
      display:inline-block;margin-top:15px;background:#8A0303;
      padding:10px 16px;border-radius:8px;color:white;
      font-family:Arial;text-decoration:none;font-size:12px;">
      <i class="fas fa-coins"></i> Buy Key Access
    </a>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const DB_URL = "https://raw.githubusercontent.com/AMMOFFICIAL/X-SILENT/refs/heads/main/users.json";

    function showToast(msg){
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(()=>t.style.display="none",3500);
    }

    document.getElementById("loginForm").addEventListener("submit", async (e)=>{
      e.preventDefault();

      const username = e.target.username.value.trim();
      const password = e.target.password.value.trim();

      try {
        const res = await fetch(DB_URL);
        const users = await res.json();

        const match = users.find(u => u.username === username && u.password === password);

        if(match){
          showToast("Login berhasil!");
          localStorage.setItem("logged", "true");
          setTimeout(()=>window.location.href = "xvct.html", 1200);
        } else {
          showToast("Username atau password salah!");
        }
      } catch (err){
        showToast("Tidak dapat terhubung ke server!");
      }
    });
  </script>

</body>
</html>
